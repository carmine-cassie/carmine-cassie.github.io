<!doctype html>
<html>
  <head>
    <title>The Photograph Loop</title>
    <meta name="viewport" content="width=device-width" />
    <meta charset="utf-8" />

    <!-- Google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        background-color: black;
        color: #f5ddbf;
        text-shadow: #c9a369 1px 1px 5px;
        font-family: 'Marcellus';
        text-align: center;
        font-size: 1.25em;
      }

      * {
        margin: 8px;
      }

      h1 {
        font-weight: normal;
        font-size: 3em;
        line-height: 0.8em;
      }
    </style>
  </head>
  <body>
    <div style="max-width: 30em; margin: 0 auto; padding: 50px 0">
      <h1>Ghost Quartet<br />The Photograph</h1>
      <p>
        The cello in this song plays one arpeggio the whole way through. Here it is
        as a looping track to play against.
      </p>
      <audio loop controls src="photograph_loop.flac"></audio>
    </div>
  </body>
</html>
