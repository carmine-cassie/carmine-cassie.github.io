<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'nasin-nanpa';
        src: url('/assets/fonts/nasin-nanpa-5.0.0-beta.3.otf') format('opentype');
      }

      @font-face {
        font-family: 'luka Eko';

      :root {

        background-image: url('telo.png');

        background-position: center;
      }

      * {
        margin: 0;
      }

      .postcard {
        background-color: white;
        background-image: url('paper.jpg');
        background-position: center;
        background-size: cover;
        width: 200px;
        min-height: 100px;
        height: fit-content;
        padding: 10px;
        box-shadow: 7px 7px #31059499;

        img {
          height: 100px;
          float: right;
          margin-left: 10px;
          box-shadow: 0px 0px 1px 1px #0002;
        }

        p {
          margin-top: 10px;
          font-family: 'luka Eko';
          font-size: 40px;
          line-height: 38px;
        }
      }
    </style>
  </head>
